<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Obsidian and amber mountain horizon</title>
  <desc id="desc">A dark mountain landscape with a warm amber horizon and a lone figure facing the light.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080909"/>
      <stop offset="0.55" stop-color="#15120e"/>
      <stop offset="0.76" stop-color="#8a531c"/>
      <stop offset="1" stop-color="#18120d"/>
    </linearGradient>
    <radialGradient id="sun" cx="73%" cy="42%" r="28%">
      <stop offset="0" stop-color="#ffd692" stop-opacity="0.98"/>
      <stop offset="0.2" stop-color="#f0ae4f" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#b96d22" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftFade" x1="0" x2="1">
      <stop offset="0" stop-color="#050606" stop-opacity="1"/>
      <stop offset="0.36" stop-color="#050606" stop-opacity="0.97"/>
      <stop offset="0.55" stop-color="#050606" stop-opacity="0.55"/>
      <stop offset="0.78" stop-color="#050606" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.58" stop-color="#050606" stop-opacity="0"/>
      <stop offset="1" stop-color="#050606" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <ellipse cx="1170" cy="435" rx="155" ry="38" fill="#f6bb61" opacity="0.15" filter="url(#glow)"/>
