name: Deploy Exit Framework to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate launch site
        shell: bash
        run: |
          set -euo pipefail

          for f in index.html founders.html membership.html faq.html has.html privacy.html framework.html about.html philosophy.html applications.html articles.html styles.css brand-v14.css launch.css launch.js launch-config.js hero.js hero-v16.css site-v17.css assets/hero-desktop-v8.webp assets/exit-framework-poster-9x16.webp; do
            test -s "$f"
          done
          test "$(cat CNAME)" = "chaosexit.com"

          ! grep -Rni --include='*.html' --include='*.xml' --include='*.txt' 'theexitmission.com' .
          ! grep -Rni --include='*.html' 'chaos into control' .
          ! grep -Rni --include='*.html' 'Control to fredom' .
          ! grep -Rni --include='*.html' -E 'href="(\.\./)?has\.html([#?][^"]*)?"' .
          grep -q 'site-v17.css?v=17' index.html
          grep -q 'hero-desktop-v8.webp?v=17' index.html
          grep -q 'exit-framework-poster-9x16.webp?v=17' index.html
          for f in index.html founders.html membership.html faq.html about.html applications.html; do grep -q 'humanautonomystudy.org' "$f"; done
          grep -q 'Research participation is not sold' index.html

          for term in Stabilize Observe Separate Choose Execute Measure Document Adjust; do
            grep -q "$term" framework.html
            grep -q "$term" index.html
          done

          while IFS= read -r page; do
            [ "$page" = "./404.html" ] && continue
            if ! grep -Eq 'site-v17\.css|hero\.js|launch\.js' "$page"; then
              echo "V17 visual system missing from $page" >&2
              exit 1
            fi
          done < <(find . -name '*.html' -type f | sort)

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          root = Path('.').resolve()
          failures = []

          class Parser(HTMLParser):
              def __init__(self, page):
                  super().__init__()
                  self.page = page
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('href', 'src'):
                      raw = attrs.get(key)
                      if not raw or raw.startswith(('#','mailto:','tel:','javascript:','data:')):
                          continue
                      u = urlsplit(raw)
                      if u.scheme or u.netloc:
                          continue
                      path = unquote(u.path)
                      if not path:
                          continue
                      if path.startswith('/'):
                          target = root / path.lstrip('/')
                      else:
                          target = self.page.parent / path
                      target = target.resolve()
                      try:
                          target.relative_to(root)
                      except ValueError:
                          failures.append((self.page, raw, 'escapes site root'))
                          continue
                      if path.endswith('/'):
                          target = target / 'index.html'
                      if not target.exists():
                          failures.append((self.page, raw, 'missing'))

          for page in root.rglob('*.html'):
              try:
                  Parser(page).feed(page.read_text(encoding='utf-8'))
              except Exception as exc:
                  failures.append((page, '', f'parse error: {exc}'))

          if failures:
              for page, ref, reason in failures:
                  print(f'{page.relative_to(root)} -> {ref}: {reason}')
              raise SystemExit(1)
          print('Internal link/source QA passed')
          PY

          if grep -q "launchMode:'live'" launch-config.js; then
            grep -q "founderPriceConfirmed:true" launch-config.js
            grep -q "qaPassed:true" launch-config.js
            grep -q "socialVerified:true" launch-config.js
            ! grep -q "founderPaymentLink:''" launch-config.js
            ! grep -q "endpoint:''" launch-config.js
            ! grep -q "instagram:''" launch-config.js
            ! grep -q "youtube:''" launch-config.js
            ! grep -q "tiktok:''" launch-config.js
            ! grep -q "linkedin:''" launch-config.js
          else
            grep -q "launchMode:'preview'" launch-config.js
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
