name: Hero responsive QA
on:
  push:
    branches: ["qa/hero-responsive-fix"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser QA runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 4173 >/tmp/exit-framework-http.log 2>&1 &
      - name: Capture fixed branch
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_LABEL: after
        run: node qa/hero-responsive-audit.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-responsive-after
          path: qa-artifacts
