<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="t d">
  <title id="t">Exit Framework mobile portal</title>
  <desc id="d">A clean editorial EXIT composition with an amber doorway and a lone human silhouette moving toward it.</desc>
  <defs>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3514" stop-opacity=".15"/>
      <stop offset=".2" stop-color="#bd9659" stop-opacity=".72"/>
      <stop offset=".55" stop-color="#f2c777" stop-opacity=".98"/>
      <stop offset="1" stop-color="#9b622a" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bd9659" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#6d461f" stop-opacity=".1"/>
      <stop offset="1" stop-color="#050606" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050606"/>
      <stop offset=".72" stop-color="#050606" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#050606"/>
      <stop offset=".8" stop-color="#050606" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-20%" width="260%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-60%" width="260%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="#050606"/>

  <g opacity=".12" stroke="#bd9659" stroke-width="1">
    <path d="M90 0v1920M270 0v1920M450 0v1920M630 0v1920M810 0v1920M990 0v1920"/>
    <path d="M0 220h1080M0 440h1080M0 660h1080M0 880h1080M0 1100h1080M0 1320h1080M0 1540h1080"/>
  </g>

  <circle cx="540" cy="760" r="380" fill="none" stroke="#bd9659" stroke-opacity=".11" stroke-width="2"/>
  <circle cx="540" cy="760" r="250" fill="none" stroke="#eadfcd" stroke-opacity=".06" stroke-width="1"/>

  <text x="540" y="900"
        text-anchor="middle"
        textLength="930"
        lengthAdjust="spacingAndGlyphs"
        font-family="Arial Black, Impact, Arial, sans-serif"
        font-size="390"
        font-weight="900"
        fill="#eadfcd">EXIT</text>

  <rect x="462" y="250" width="156" height="1120" rx="2" fill="#bd9659" opacity=".34" filter="url(#glow)"/>
  <rect x="482" y="270" width="116" height="1080" fill="url(#door)"/>
  <path d="M486 270h108M486 270v1080M594 270v1080" fill="none" stroke="#f2c777" stroke-opacity=".35" stroke-width="2"/>

  <ellipse cx="540" cy="1370" rx="150" ry="26" fill="#bd9659" opacity=".24" filter="url(#softGlow)"/>
  <path d="M500 1330h80l140 360H360z" fill="url(#floor)" opacity=".55"/>

  <g fill="#080909" stroke="#bd9659" stroke-opacity=".18" stroke-width="2">
    <circle cx="540" cy="1192" r="24"/>
    <path d="M505 1222c11-18 25-28 35-28s24 10 35 28l18 157c2 16-8 28-22 31l-8 2-7 113h-30l-7-113-8-2c-14-3-24-15-22-31z"/>
    <path d="M510 1282l-45 112" fill="none" stroke="#080909" stroke-width="20" stroke-linecap="round"/>
    <path d="M570 1282l45 112" fill="none" stroke="#080909" stroke-width="20" stroke-linecap="round"/>
    <path d="M530 1505l-18 122" fill="none" stroke="#080909" stroke-width="22" stroke-linecap="round"/>
    <path d="M550 1505l18 122" fill="none" stroke="#080909" stroke-width="22" stroke-linecap="round"/>
  </g>

  <rect width="1080" height="330" fill="url(#fadeTop)"/>
  <rect y="1470" width="1080" height="450" fill="url(#fadeBottom)"/>
</svg>