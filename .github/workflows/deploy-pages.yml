name: Deploy Exit Framework to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Do not cancel a deployment after deploy-pages has handed it to Pages.
  # Cancelling at that point can leave Pages holding an in-progress deployment,
  # which blocks every subsequent deployment for the same site.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s hero.js
          test -s assets/hero-desktop-v8.webp
          test -s assets/hero-mobile-v8.webp
          test "$(cat CNAME)" = "chaosexit.com"
          ! grep -Rni --include='*.html' 'chaos into control' .

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
