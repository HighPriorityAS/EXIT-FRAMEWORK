name: Build EXIT hero v37

on:
  push:
    branches: ["hero-v37-hires"]
    paths:
      - ".hero-v37/**"
      - ".github/workflows/build-hero-v37.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero-v37-hires
          fetch-depth: 0
      - name: Decode and verify hero
        shell: bash
        run: |
          set -euo pipefail
          test -f .hero-v37/part-08
          cat .hero-v37/part-* > /tmp/hero.b64
          test "$(wc -c < /tmp/hero.b64)" -eq 168808
          base64 -d /tmp/hero.b64 > assets/exit-hero-approved-v37.webp
          echo "ac26cbfc995f9590ab769e6e68dfecb8be9baab8276135108fcdf1e4c53af42c  assets/exit-hero-approved-v37.webp" | sha256sum -c -
          test "$(wc -c < assets/exit-hero-approved-v37.webp)" -eq 126604
      - name: Point homepage and validation at v37
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          old='src="assets/exit-hero-approved-v36.webp" width="800" height="450"'
          new='src="assets/exit-hero-approved-v37.webp" width="1520" height="855"'
          if old not in s:
              raise SystemExit("Expected v36 hero tag not found")
          p.write_text(s.replace(old,new,1))
          v=Path("validate.py")
          t=v.read_text()
          if "exit-hero-approved-v36.webp" not in t:
              raise SystemExit("Expected v36 validation token not found")
          v.write_text(t.replace("exit-hero-approved-v36.webp","exit-hero-approved-v37.webp"))
      - name: Commit finished asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hero-v37
          rm -f .github/workflows/build-hero-v37.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade EXIT homepage hero to high-resolution v37"
          git push origin HEAD:hero-v37-hires
