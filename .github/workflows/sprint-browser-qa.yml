name: Sprint browser QA

on:
  pull_request:
    branches: ["main"]
    paths:
      - "30-day-control-sprint.html"
      - "30-day-control-sprint.js"
      - "control-room.html"
      - "control-room.js"\n      - "mimir-hud.html"\n      - "mimir-hud.css"\n      - "mimir-hud.js"\n      - "tests/mimir-hud-qa.spec.js"
      - "account.html"
      - "account.js"
      - "exit-state.js"
      - "privacy.html"
      - "control-sprint.html"
      - "sprint-access.html"
      - "conversion.js"
      - "index.html"
      - "chaos-audit.html"
      - "minimum-viable-day.html"
      - "daily-mission.html"
      - "launch-config.js"
      - "launch-loop.css"
      - "launch-metrics.js"
      - "sitemap.xml"
      - "validate.py"
      - "tests/control-sprint-qa.spec.js"
      - "tests/control-room-qa.spec.js"
      - "tests/auth-sync-qa.spec.js"
      - "tests/conversion-funnel-qa.spec.js"
      - ".github/workflows/sprint-browser-qa.yml"

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/exit-server.log 2>&1 &
          echo $! > /tmp/exit-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/30-day-control-sprint.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/exit-server.log
          exit 1

      - name: Run Sprint browser QA
        run: npx playwright test tests/control-sprint-qa.spec.js tests/control-room-qa.spec.js tests/auth-sync-qa.spec.js tests/conversion-funnel-qa.spec.js tests/mimir-hud-qa.spec.js --reporter=line

      - name: Run structural validator
        run: |
          python -m pip install Pillow==11.3.0
          python validate.py --decode