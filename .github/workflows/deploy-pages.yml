name: Deploy Exit Framework to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate launch site
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s founders.html
          test -s membership.html
          test -s faq.html
          test -s has.html
          test -s privacy.html
          test -s styles.css
          test -s brand-v14.css
          test -s launch.css
          test -s launch.js
          test -s launch-config.js
          test -s hero.js
          test -s assets/hero-chaos-control-v14.webp
          test "$(cat CNAME)" = "chaosexit.com"
          ! grep -Rni --include='*.html' 'chaos into control' .
          ! grep -Rni --include='*.html' 'Control to fredom' .
          grep -q 'hero-chaos-control-v14.webp' index.html
          grep -q 'Human Autonomy Study' has.html
          grep -q 'Research participation is not sold' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
