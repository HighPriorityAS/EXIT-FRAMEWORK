name: Mission copy and visual smoke QA
on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - 'assets/mission-operations-map.svg'
      - 'validate.py'
      - '.github/workflows/mission-copy-qa.yml'
permissions:
  contents: read
jobs:
  mission-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate routes, assets, metadata and branding
        run: |
          python -m pip install Pillow==11.3.0
          python validate.py --decode
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          ET.parse('assets/mission-operations-map.svg')
          index = Path('index.html').read_text()
          assert 'One mission. Your own way out.' in index
          assert 'Join the mission' in index
          assert 'https://theexitmission.com/' in index
          assert 'Exit Framework' not in index
          print('PASS: canonical branding and valid operations-map SVG')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for visual smoke checks
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check layout and capture screenshots
        run: |
          python -m http.server 4173 > /tmp/mission-site.log 2>&1 &
          mkdir -p qa-mission
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const width of [390, 768, 1440]) {
              const page = await browser.newPage({ viewport: { width, height: 900 }, deviceScaleFactor: 1 });
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
              const result = await page.evaluate(() => ({
                title: document.title,
                h1: document.querySelectorAll('h1').length,
                horizontalOverflow: document.documentElement.scrollWidth > innerWidth + 2,
                ctas: [...document.querySelectorAll('.portal-hero-actions a')].map(a => a.textContent.trim()),
                backdrop: getComputedStyle(document.querySelector('.portal-copy'),'::before').backgroundImage
              }));
              if (result.h1 !== 1 || result.horizontalOverflow || result.ctas.length !== 1 || !result.backdrop.includes('mission-operations-map.svg')) {
                throw new Error('Homepage QA failed at ' + width + 'px: ' + JSON.stringify(result));
              }
              await page.screenshot({ path: 'qa-mission/home-' + width + '.png' });
              await page.goto('http://127.0.0.1:4173/framework.html', { waitUntil: 'networkidle' });
              const plan = await page.locator('h1').textContent();
              if (!plan || !plan.includes('mission')) throw new Error('Mission Plan heading missing');
              if (await page.evaluate(() => document.documentElement.scrollWidth > innerWidth + 2)) throw new Error('Mission Plan horizontal overflow at ' + width);
              await page.screenshot({ path: 'qa-mission/plan-' + width + '.png', fullPage: false });
              const menu = page.locator('#mobile-menu');
              const toggle = page.getByRole('button', { name: /open menu/i });
              await toggle.focus();
              await page.keyboard.press('Enter');
              if (await toggle.getAttribute('aria-expanded') !== 'true' || !await menu.isVisible()) throw new Error('Menu did not open with keyboard');
              const links = menu.locator('a');
              const labels = await links.allTextContents();
              if (labels.join('|') !== 'Mission Plan|Control Room|Field Notes|About') throw new Error('Unexpected menu links: ' + labels);
              const positions = await links.evaluateAll(nodes => nodes.map(n => ({y: Math.round(n.getBoundingClientRect().top), x: Math.round(n.getBoundingClientRect().left)})));
              const rows = new Set(positions.map(p => p.y)).size;
              if (rows !== (width >= 768 ? 1 : 2)) throw new Error('Menu has unexpected row count at ' + width + ': ' + JSON.stringify(positions));
              const footer = await page.locator('.footer-grid nav a').evaluateAll(nodes => nodes.map(n => ({text:n.textContent.trim(), x:Math.round(n.getBoundingClientRect().left), y:Math.round(n.getBoundingClientRect().top)})));
              if (footer.length !== 9 || new Set(footer.map(p => p.y)).size !== 3 || new Set(footer.map(p => p.x)).size !== 3) throw new Error('Footer is not a 3 by 3 grid at ' + width + ': ' + JSON.stringify(footer));
              await page.keyboard.press('Escape');
              if (await toggle.getAttribute('aria-expanded') !== 'false') throw new Error('Escape did not close menu');
              await page.goto('http://127.0.0.1:4173/control-room.html', { waitUntil:'networkidle' });
              const empty = page.locator('[data-cr-empty]');
              for (const destination of ['chaos-audit.html','minimum-viable-day.html','daily-mission.html','30-day-control-sprint.html']) {
                if (await empty.locator('a[href="' + destination + '"]').count() !== 1) throw new Error('Control Room missing entry: ' + destination);
              }
              if (await page.evaluate(() => document.documentElement.scrollWidth > innerWidth + 2)) throw new Error('Control Room horizontal overflow at ' + width);
              await page.close();
            }
            await browser.close();
            console.log('PASS: responsive mission smoke test at 390 / 768 / 1440');
          })().catch(e => { console.error(e); process.exit(1); });
          JS
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-visual-screenshots
          path: qa-mission/
          retention-days: 7
          if-no-files-found: ignore
